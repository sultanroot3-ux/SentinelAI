name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: API/unit suite on SQLite.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend (pytest, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `datetime.utcnow()` is deprecated and will be removed. It is also the
      # kind of thing that creeps back in one call site at a time, because each
      # reintroduction looks harmless. Runs before the install so it fails in
      # seconds. See backend/app/core/clock.py for what to use instead.
      - name: Guard - no datetime.utcnow()
        run: |
          if grep -rn --include='*.py' 'datetime\.utcnow' backend/app backend/tests \
               | grep -v '^backend/app/core/clock.py:'; then
            echo
            echo "::error::datetime.utcnow() is deprecated. Use utcnow() from app.core.clock"
            echo "  (naive UTC, for database columns) or now_utc() (timezone-aware, for"
            echo "  JWT exp and other offset-aware boundaries)."
            exit 1
          fi
          echo "OK: no datetime.utcnow() outside app/core/clock.py"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      # The committed schema had drifted (it still advertised the old
      # `recognition_accuracy` field), so it is now generated and checked.
      - name: Check docs/openapi.json matches the code
        run: python scripts/export-openapi.py --check

  # ---------------------------------------------------------------------------
  # Same suite against real PostgreSQL and real Redis, so the shared-state
  # backend (B4) and the SQL portability paths are exercised, not just SQLite
  # and the in-memory limiter.
  # ---------------------------------------------------------------------------
  backend-tests-postgres:
    name: Backend (pytest, PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Run tests against PostgreSQL + Redis
        working-directory: backend
        env:
          SENTINEL_TEST_DATABASE_URL: postgresql+psycopg2://sentinel:sentinel@localhost:5432/sentinelai_test
          # Drives the app's own shared-state backend...
          SENTINEL_REDIS_URL: redis://localhost:6379/1
          # ...and points the Redis-backend unit tests at a real server rather
          # than fakeredis, so the Lua scripts run on genuine Redis.
          SENTINEL_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/ -v --tb=short

      - name: Assert the suite actually used Redis
        working-directory: backend
        env:
          SENTINEL_REDIS_URL: redis://localhost:6379/1
        run: |
          python - <<'PY'
          from app.core.shared_state import shared_state
          assert shared_state.is_shared, (
              f"expected the Redis backend, got {shared_state.backend_name!r} — "
              "the multi-worker correctness tests would be meaningless"
          )
          print("shared-state backend:", shared_state.backend_name)
          PY

  # ---------------------------------------------------------------------------
  # B1: the real AI engine. This is the job that must never silently degrade to
  # the Haar fallback, so it installs insightface/onnxruntime and runs the
  # pipeline suite with SENTINEL_REQUIRE_AI=1 — a missing engine fails here
  # instead of skipping.
  # ---------------------------------------------------------------------------
  ai-engine-tests:
    name: AI engine (insightface + ONNX Runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-ai.txt
            backend/requirements-dev.txt

      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies (including the AI engine)
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt
          pip install --require-hashes -r requirements-ai.txt

      # The buffalo_l pack is ~300 MB; caching it keeps the job fast on a warm
      # cache. Keyed by the pinned model version so a change re-downloads.
      - name: Cache buffalo_l model pack
        uses: actions/cache@v4
        with:
          path: ~/.insightface/models
          key: insightface-buffalo_l-v0.7

      - name: Verify the AI engine imports and the model loads
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services import face_service
          assert face_service.insightface_available(), (
              "insightface is not usable — this job exists to exercise it"
          )
          face_service._get_insightface_app()
          print("AI engine ready: insightface + onnxruntime, buffalo_l loaded")
          PY

      - name: Run the AI pipeline suite (skips are failures here)
        working-directory: backend
        env:
          SENTINEL_REQUIRE_AI: "1"
        run: python -m pytest tests/test_ai_pipeline.py -v --tb=short

      - name: Run the full suite with the AI engine present
        working-directory: backend
        env:
          SENTINEL_REQUIRE_AI: "1"
        run: python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # B5: the Playwright suite. It boots a real uvicorn backend and serves the
  # built frontend bundle, so it exercises the production build rather than the
  # dev server. Reports/traces are uploaded for debugging.
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
          # playwright.config.ts prefers backend/.venv when present; in CI the
          # dependencies are on the system interpreter, so point at it directly.
          E2E_BACKEND_PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          tags: sentinelai-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Proves the shipped image contains the real engine, so a production
      # container can never quietly fall back to Haar-cascade detection (B1).
      #
      # Also guards the slimming work: the image ships headless OpenCV and only
      # three of buffalo_l's five models. Loading the engine is not enough to
      # prove that — a missing recognition model surfaces as "nothing ever
      # matches", which looks like a tuning problem in production rather than a
      # broken build. So this runs a real inference and checks the embedding.
      - name: Verify the AI engine inside the built image
        run: |
          # -i is load-bearing. Without it docker does not attach stdin, so
          # `python -` reads EOF, executes nothing and exits 0 — the step passes
          # no matter what the image contains. This check was silently vacuous
          # until 2026-08-01; the `--network none` below is what proves offline.
          set -o pipefail
          docker run --rm -i --network none --entrypoint python sentinelai-backend:ci - <<'PY' | tee /tmp/engine-check.log
          import pathlib

          import cv2
          import insightface
          import numpy as np

          from app.services import face_service

          assert face_service.insightface_available(), (
              "the production image does not have a working AI engine"
          )

          # Importing cv2 at all is the headless proof: the image has no libgl1,
          # so a GUI build would fail here with "libGL.so.1: cannot open shared
          # object file". (hasattr(cv2, "imshow") is not a test — the headless
          # wheel still exports it and only raises when called.)
          print("cv2", cv2.__version__, "imported without libGL")

          app = face_service._get_insightface_app()

          loaded = sorted(app.models)
          expected = sorted(face_service.INSIGHTFACE_MODULES)
          assert loaded == expected, f"loaded modules {loaded} != expected {expected}"

          # Real inference on a real photo. Session init alone would still pass
          # with a truncated or wrong recognition model.
          blank = app.get(np.zeros((640, 640, 3), dtype=np.uint8))
          assert blank == [], f"expected 0 faces on a blank frame, got {len(blank)}"

          sample = pathlib.Path(insightface.__file__).parent / "data/images/t1.jpg"
          faces = app.get(cv2.imread(str(sample)))
          assert len(faces) >= 5, f"detection regressed: {len(faces)} faces in t1.jpg"

          emb = faces[0].normed_embedding
          assert emb.shape == (512,), f"embedding shape {emb.shape}"
          assert abs(float(np.linalg.norm(emb)) - 1.0) < 1e-3, "embedding not normalised"

          print(f"modules {loaded}, {len(faces)} faces, 512-d normalised embedding")
          print("ENGINE_CHECK_PASSED")
          PY

          # The sentinel makes vacuousness detectable. If someone drops the -i
          # again, or the heredoc stops reaching the interpreter for any other
          # reason, python exits 0 having run nothing and every assert above is
          # skipped — but this grep still fails the build.
          grep -q ENGINE_CHECK_PASSED /tmp/engine-check.log || {
            echo "::error::the engine check produced no result — it did not actually run"
            exit 1
          }
          echo "Production image AI engine OK (buffalo_l loaded and inferring offline)"

      - name: Verify the image carries no GUI OpenGL stack
        run: |
          docker run --rm --entrypoint bash sentinelai-backend:ci -c '
            fail=0
            for p in libgl1 libllvm19 mesa-libgallium; do
              if dpkg -s "$p" >/dev/null 2>&1; then
                echo "::error::$p is installed; the headless OpenCV swap regressed"
                fail=1
              fi
            done
            for m in 1k3d68.onnx genderage.onnx; do
              if [ -f "/home/sentinel/.insightface/models/buffalo_l/$m" ]; then
                echo "::error::unused model $m is back in the image"
                fail=1
              fi
            done
            exit $fail
          '
          echo "OK: no GUI OpenGL stack, no unused models"

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Validate production compose config
        run: |
          cp .env.example .env
          sed -i 's/^SENTINEL_SECRET_KEY=$/SENTINEL_SECRET_KEY=ci-validate-only/' .env
          sed -i 's/^SENTINEL_DB_PASSWORD=$/SENTINEL_DB_PASSWORD=ci-validate-only/' .env
          touch docker/nginx.rendered.conf
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  # ---------------------------------------------------------------------------
  # Guards against B2 regressing: the lock files must stay fully pinned and
  # hash-verified, and must stay in sync with the .in files they derive from.
  # ---------------------------------------------------------------------------
  dependency-locks:
    name: Dependency locks (pinned + hashed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Assert every dependency is pinned and hashed
        working-directory: backend
        run: |
          python - <<'PY'
          import re, sys

          failures = []
          for name in (
              "requirements.txt",
              "requirements-dev.txt",
              "requirements-ai.txt",
              "requirements-headless.txt",
          ):
              text = open(name).read()
              # Join escaped line continuations so each requirement is one line.
              joined = text.replace("\\\n", " ")
              reqs = [
                  ln for ln in joined.splitlines()
                  if ln.strip() and not ln.lstrip().startswith("#") and not ln.startswith("-")
              ]
              if not reqs:
                  failures.append(f"{name}: no requirements found")
                  continue
              for line in reqs:
                  spec = line.split(";")[0]
                  if "==" not in spec:
                      failures.append(f"{name}: unpinned requirement: {line.strip()[:80]}")
                  if "--hash=sha256:" not in line:
                      pkg = re.split(r"[=<>\[ ]", line.strip())[0]
                      failures.append(f"{name}: missing hash for {pkg}")
              print(f"{name}: {len(reqs)} requirements, all pinned and hashed")

          if failures:
              print("\nFAILURES:", *failures, sep="\n  ")
              sys.exit(1)
          PY

      - name: Verify locks are in sync with the .in files
        working-directory: backend
        run: |
          pip install pip-tools
          for f in requirements requirements-dev requirements-ai requirements-headless; do
            cp "$f.txt" "/tmp/$f.txt.orig"
          done
          pip-compile --quiet --generate-hashes --strip-extras \
            --output-file requirements.txt requirements.in
          pip-compile --quiet --generate-hashes --strip-extras \
            --output-file requirements-dev.txt requirements-dev.in
          pip-compile --quiet --generate-hashes --strip-extras \
            --output-file requirements-ai.txt requirements-ai.in
          pip-compile --quiet --generate-hashes --strip-extras \
            --output-file requirements-headless.txt requirements-headless.in
          for f in requirements requirements-dev requirements-ai requirements-headless; do
            if ! diff -q "/tmp/$f.txt.orig" "$f.txt" >/dev/null; then
              echo "::error::$f.txt is out of date with $f.in."
              echo "Regenerate with ./scripts/lock-requirements.sh and commit."
              diff "/tmp/$f.txt.orig" "$f.txt" | head -40 || true
              exit 1
            fi
          done
          echo "All lock files are in sync with their .in sources."

      # requirements-headless.in pins opencv-python-headless by hand, because
      # nothing derives it from the GUI build that insightface pulls in. A
      # Dependabot bump to one and not the other would ship an image whose
      # OpenCV is a different version from the audited one, and no other check
      # would notice.
      - name: Verify the two OpenCV builds are the same version
        working-directory: backend
        run: |
          gui=$(grep -oE '^opencv-python==[0-9.]+' requirements.txt | cut -d= -f3)
          headless=$(grep -oE '^opencv-python-headless==[0-9.]+' requirements-headless.txt | cut -d= -f3)
          echo "opencv-python=$gui  opencv-python-headless=$headless"
          if [ -z "$gui" ] || [ -z "$headless" ]; then
            echo "::error::could not read one of the OpenCV versions"; exit 1
          fi
          if [ "$gui" != "$headless" ]; then
            echo "::error::OpenCV version drift: requirements.txt has $gui but"
            echo "  requirements-headless.in pins $headless. The production image"
            echo "  swaps one for the other, so they must match. Update the pin in"
            echo "  requirements-headless.in and re-run ./scripts/lock-requirements.sh."
            exit 1
          fi
          echo "OK: both OpenCV distributions are $gui"
